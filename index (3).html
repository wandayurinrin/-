        function TabMonthly({ records, projects, onGoToReport }) {
          const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
          const [expandedDates, setExpandedDates] = useState({});
          
          const projMap = useMemo(() => {
            const map = {}; projects.forEach(p => map[p.id] = p.name); return map;
          }, [projects]);

          const groupedByDate = useMemo(() => {
            let list = records.filter(r => r.date.startsWith(month));
            const map = {};
            
            list.forEach(r => {
                if(r.employees.length === 0) return;
                const dateKey = r.date;
                if (!map[dateKey]) map[dateKey] = { date: dateKey, pGroup: {} };
                
                r.employees.forEach(e => {
                    if(e.dayType === '休假') return;
                    e.projects.forEach(pr => {
                        if(!pr.projId) return;
                        const key = `${pr.projId}_${e.dayType}`;
                        if(!map[dateKey].pGroup[key]) {
                            map[dateKey].pGroup[key] = { projId: pr.projId, name: projMap[pr.projId]||'未知', dayType: e.dayType, empSet: new Set(), tasks: new Set() };
                        }
                        map[dateKey].pGroup[key].empSet.add(e.id || e.name);
                        map[dateKey].pGroup[key].tasks.add(pr.taskName || '施工');
                    });
                });
            });
            
            return Object.values(map).map(day => {
                const groups = Object.values(day.pGroup);
                const coverMap = {};
                groups.forEach(g => {
                    if(!coverMap[g.projId]) coverMap[g.projId] = { name: g.name, empSet: new Set() };
                    g.empSet.forEach(empId => coverMap[g.projId].empSet.add(empId));
                });
                const coverText = Object.values(coverMap).map(c => `${c.name}(${c.empSet.size}人)`).join('、');
                
                return {
                    date: day.date,
                    coverText: coverText || '無出勤',
                    details: groups.map(g => ({
                        ...g,
                        count: g.empSet.size,
                        taskStr: Array.from(g.tasks).join('、')
                    }))
                };
            }).sort((a,b)=>b.date.localeCompare(a.date));
          }, [records, month, projMap]);

          return (
            <div className="space-y-2">
              <Card className="flex items-center">
                <input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="compact-input font-bold w-full" />
              </Card>

              <div className="space-y-1.5">
                {groupedByDate.map(item => (
                  <Card key={item.date} className="p-0 overflow-hidden cursor-pointer border-slate-200">
                    <div className="p-2 bg-white flex justify-between items-center" onClick={()=>setExpandedDates(p=>({...p, [item.date]: !p[item.date]}))}>
                        <div className="flex items-center gap-2 truncate">
                            <span className="font-mono text-blue-600 font-extrabold text-[11px] shrink-0">{item.date.slice(5)}</span>
                            <span className="text-[11px] text-slate-800 font-bold truncate">{item.coverText}</span>
                        </div>
                        <span className="text-[10px] text-slate-400 shrink-0 ml-1">{expandedDates[item.date]?'▲':'▼'}</span>
                    </div>
                    {expandedDates[item.date] && item.details.length > 0 && (
                        <div className="bg-slate-50 border-t border-slate-100 p-1 space-y-1">
                            {item.details.map((det, idx) => (
                                <div key={idx} onClick={(e)=>{e.stopPropagation(); onGoToReport(item.date);}} className="text-[11px] flex justify-between bg-white px-2 py-1 rounded shadow-2xs active:bg-blue-50 border border-slate-200">
                                    <div className="flex gap-1.5 truncate">
                                        <span className="font-bold text-slate-800">{det.name}</span>
                                        <span className="text-slate-300">|</span>
                                        <span className="text-slate-600">{det.count}人</span>
                                        <span className="text-slate-300">|</span>
                                        <span className="text-slate-600">{det.dayType}</span>
                                        <span className="text-slate-300">|</span>
                                        <span className="text-slate-600 truncate">{det.taskStr}</span>
                                    </div>
                                    <span className="text-[10px] text-blue-600 shrink-0 font-bold ml-2">看日報 ❯</span>
                                </div>
                            ))}
                        </div>
                    )}
                  </Card>
                ))}
                {groupedByDate.length === 0 && <div className="text-center text-slate-400 py-4 font-medium bg-white rounded-lg border border-slate-200 text-[11px]">該月無資料</div>}
              </div>
            </div>
          );
        }

        function TabReport({ records, projects, onEdit, onDelete, reportSelectedDate, setReportSelectedDate }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedDate, setSelectedDate] = useState(null);
          const [expandedCards, setExpandedCards] = useState({});
          
          useEffect(() => { 
            if (reportSelectedDate) {
              setSelectedDate(reportSelectedDate);
              setSelectedMonth(reportSelectedDate.slice(0, 7));
            } else { setSelectedDate(null); }
          }, [reportSelectedDate]);

          useEffect(() => {
              if (selectedMonth !== reportSelectedDate?.slice(0, 7)) {
                  setReportSelectedDate(null); setSelectedDate(null);
              }
          }, [selectedMonth]);

          const [yearStr, monthStr] = selectedMonth.split('-');
          const year = parseInt(yearStr); const month = parseInt(monthStr);
          const firstDayIndex = new Date(year, month - 1, 1).getDay();
          const daysInMonth = new Date(year, month, 0).getDate();

          const monthRecs = useMemo(() => records.filter(r => r.date.startsWith(selectedMonth)), [records, selectedMonth]);
          
          const summary = useMemo(() => {
              let cost = 0; let eCount = 0;
              monthRecs.forEach(r => {
                 r.employees.forEach(e => {
                     if(e.dayType!=='休假') { 
                         let s = Number(e.salary)||0;
                         let a = (e.allowances||[]).reduce((sum, al) => sum + (Number(al.amount)||0), 0);
                         cost += (s + a);
                         eCount++;
                     }
                 });
                 r.materials.forEach(m => { cost += Number(m.total)||0; });
                 r.expenses.forEach(ex => { cost += Number(ex.total)||0; });
              });
              return { cost, count: monthRecs.length, eCount };
          }, [monthRecs]);

          const workDates = new Set(); const holidayDates = new Set();
          monthRecs.forEach(r => {
             const isHoliday = r.employees.every(e => e.dayType === '休假') && r.materials.length===0 && r.expenses.length===0 && r.employees.length>0;
             if(isHoliday) holidayDates.add(r.date); else workDates.add(r.date);
          });

          const displayRecs = useMemo(() => {
             if(selectedDate) return monthRecs.filter(r => r.date === selectedDate);
             return monthRecs.sort((a,b)=>b.date.localeCompare(a.date));
          }, [monthRecs, selectedDate]);

          const projMap = useMemo(() => {
            const map = {}; projects.forEach(p => map[p.id] = p.name); return map;
          }, [projects]);

          return (
            <div className="space-y-2">
              <div className="flex gap-2">
                <div className="flex-1 bg-white rounded-xl shadow-sm p-2.5 border border-slate-200 flex flex-col justify-between">
                    <h3 className="font-bold text-slate-600 text-[11px] mb-1.5 border-b border-slate-100 pb-1">日報摘要</h3>
                    <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="text-[11px] font-bold outline-none border-b border-slate-200 pb-1 w-full bg-transparent mb-1.5 text-slate-800" />
                    <div className="space-y-1.5">
                        <div>
                            <p className="text-slate-400 text-[10px]">總成本</p>
                            <p className="font-bold text-rose-600 text-sm">${summary.cost.toLocaleString()}</p>
                        </div>
                        <div className="flex justify-between items-center gap-1 pt-1.5 border-t border-slate-100">
                            <div>
                                <p className="text-slate-400 text-[10px]">紀錄數</p>
                                <p className="font-bold text-slate-800 text-[11px]">{summary.count}</p>
                            </div>
                            <div>
                                <p className="text-slate-400 text-[10px]">施工/休</p>
                                <p className="font-bold text-slate-800 text-[11px]">{workDates.size} / {holidayDates.size}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="flex-[1.3] bg-white rounded-xl shadow-sm p-2.5 border border-slate-200 flex flex-col justify-between">
                    <div className="flex justify-between items-center mb-1.5 pb-1 border-b border-slate-100">
                        <h3 className="font-bold text-slate-600 text-[11px]">當月日曆</h3>
                        {selectedDate && <button onClick={() => {setSelectedDate(null); setReportSelectedDate(null);}} className="text-[10px] text-blue-600 font-bold bg-blue-50 px-1.5 py-0.5 rounded">顯示整月</button>}
                    </div>
                    <div>
                        <div className="grid grid-cols-7 gap-0.5 text-center text-[10px] font-bold text-slate-400 mb-0.5">
                            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                        </div>
                        <div className="grid grid-cols-7 gap-0.5 text-center text-[11px]">
                            {Array.from({ length: firstDayIndex }).map((_, i) => <div key={`empty-${i}`} />)}
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                                const day = i + 1;
                                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                const isWork = workDates.has(dateStr);
                                const isHol = holidayDates.has(dateStr);
                                const isSel = selectedDate === dateStr;
                                
                                let styleClass = "text-slate-800 font-medium"; 
                                if (isWork) {
                                    styleClass = "text-blue-600 font-bold";
                                } else if (isHol) {
                                    styleClass = "text-amber-500 font-bold";
                                }
                                
                                if (isSel) {
                                    styleClass += " bg-slate-200 ring-1 ring-slate-400 rounded";
                                }

                                return (
                                    <div key={dateStr} onClick={() => setSelectedDate(dateStr === selectedDate ? null : dateStr)}
                                          className={`aspect-square flex items-center justify-center rounded cursor-pointer transition-all ${styleClass}`}>
                                        {day}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
              </div>

              <div className="space-y-1.5">
                <div className="text-[11px] font-bold text-slate-500 tracking-wider pl-1">{selectedDate ? `📌 ${selectedDate} 紀錄明細` : '📋 所有紀錄明細'}</div>
                {displayRecs.map(r => {
                  const isHoliday = r.employees.every(e => e.dayType === '休假') && r.materials.length===0 && r.expenses.length===0 && r.employees.length>0;
                  
                  const projGrouped = {};
                  r.employees.forEach(e => {
                      if(e.dayType==='休假') return;
                      e.projects.forEach(pr => {
                          const pName = projMap[pr.projId] || '未分類工程';
                          if(!projGrouped[pName]) projGrouped[pName] = { empMap: {}, tasks: new Set() };
                          projGrouped[pName].tasks.add(pr.taskName || '施工');
                          const empKey = e.id || e.name;
                          if (!projGrouped[pName].empMap[empKey]) {
                              projGrouped[pName].empMap[empKey] = { name: e.name, dayType: e.dayType };
                          }
                      });
                  });

                  const mats = r.materials;
                  const exps = r.expenses;
                  const isExpanded = expandedCards[r.id];

                  return (
                    <Card key={r.id} className={`p-0 overflow-hidden border-0 shadow-sm ${isHoliday ? 'ring-1 ring-amber-300' : 'ring-1 ring-slate-200'}`}>
                      <div onClick={()=>setExpandedCards(prev=>({...prev, [r.id]: !prev[r.id]}))} className={`p-2 flex justify-between items-center border-b cursor-pointer select-none ${isHoliday ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200'}`}>
                         <div className="flex items-center gap-2 truncate">
                           <span className="font-mono text-slate-900 font-black text-[11px]">{r.date}</span>
                           <span className="text-slate-300">|</span>
                           <span className="font-bold text-blue-900 truncate text-[11px]">
                             {isHoliday ? '⛱️ 休假' : Object.keys(projGrouped).join('、')}
                           </span>
                         </div>
                         <div className="flex items-center gap-2">
                           <span className="w-4 h-4 flex items-center justify-center rounded-full bg-slate-100 text-slate-400 text-[8px] shrink-0">{isExpanded ? '▲' : '▼'}</span>
                           <div className="flex gap-1" onClick={e=>e.stopPropagation()}>
                             <button onClick={()=>onEdit(r)} className="w-5 h-5 flex items-center justify-center rounded border shrink-0 bg-white border-slate-200 text-slate-400 hover:text-blue-600"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
                             <button onClick={()=>onDelete(r.id)} className="w-5 h-5 flex items-center justify-center rounded border shrink-0 bg-white border-slate-200 text-slate-400 hover:text-rose-600"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
                           </div>
                         </div>
                      </div>

                      {isExpanded && (
                        <div className="p-2 space-y-2 text-[11px]">
                           {!isHoliday && Object.entries(projGrouped).map(([pName, data], idx) => {
                              const empsList = Object.values(data.empMap);
                              const taskStr = Array.from(data.tasks).join('、');
                              const empTypesSet = Array.from(new Set(empsList.map(e => e.dayType))).join('/');
                              const empNamesStr = empsList.map(e => e.name).join('、');
                              return (
                                <div key={idx} className="bg-slate-50/70 p-2 rounded-lg border border-slate-200 space-y-1">
                                   <div className="font-extrabold text-blue-900 text-[11px]">{pName}</div>
                                   <div className="text-slate-800 font-medium">
                                      {taskStr} ｜ {empsList.length}人 ｜ {empTypesSet} ｜ {empNamesStr}
                                   </div>
                                </div>
                              );
                           })}

                           {mats.length > 0 && (
                              <div className="bg-slate-50/70 p-1.5 rounded-lg border border-slate-200 space-y-1">
                                 <div className="font-extrabold text-slate-700 border-b border-slate-200 pb-0.5 text-[10px]">📦 購買物品</div>
                                 <div className="space-y-0.5">
                                    {mats.map((m, i) => (
                                       <div key={i} className="flex justify-between items-center bg-white px-2 py-0.5 rounded border border-slate-100">
                                          <span className="text-slate-800">{m.name} x{m.qty}</span>
                                          <span className="font-bold text-slate-900">${Number(m.total).toLocaleString()}</span>
                                       </div>
                                    ))}
                                 </div>
                              </div>
                           )}

                           {exps.length > 0 && (
                              <div className="bg-slate-50/70 p-1.5 rounded-lg border border-slate-200 space-y-1">
                                 <div className="font-extrabold text-slate-700 border-b border-slate-200 pb-0.5 text-[10px]">⛽ 其他費用</div>
                                 <div className="space-y-0.5">
                                    {exps.map((ex, i) => (
                                       <div key={i} className="flex justify-between items-center bg-white px-2 py-0.5 rounded border border-slate-100">
                                          <span className="text-slate-800">{ex.name}</span>
                                          <span className="font-bold text-slate-900">${Number(ex.total).toLocaleString()}</span>
                                       </div>
                                    ))}
                                 </div>
                              </div>
                           )}

                           {r.remarks && <div className="bg-slate-50 p-1.5 rounded text-slate-700 text-[11px]">備註：{r.remarks}</div>}
                        </div>
                      )}
                    </Card>
                  );
                })}
                {displayRecs.length === 0 && <div className="text-center text-slate-400 py-4 font-medium bg-white rounded-lg border border-slate-200 text-[11px]">無資料</div>}
              </div>
            </div>
          );
        }

        function TabProjectRecord({ projects, records, setProjects }) {
          const [projFilter, setProjFilter] = useState('全部');
          const [monthFilter, setMonthFilter] = useState('');

          const pStats = useMemo(() => {
            const groupedProj = {};
            projects.forEach(p => {
              const key = `${p.name}_${p.client}`;
              if(!groupedProj[key]) groupedProj[key] = { ...p, mergedIds: [p.id], laborCost: 0, matCost: 0, otherCost: 0, dayMap: {} };
              else groupedProj[key].mergedIds.push(p.id);
            });

            const filteredRecs = monthFilter ? records.filter(r => r.date.startsWith(monthFilter)) : records;

            filteredRecs.forEach(r => {
              r.employees.forEach(e => {
                e.projects.forEach(pr => {
                  const p = projects.find(x => x.id === pr.projId);
                  if(!p) return;
                  const key = `${p.name}_${p.client}`;
                  if(groupedProj[key]) {
                    const share = (Number(e.salary)||0)/e.projects.length;
                    const allowShare = (e.allowances||[]).reduce((sum, a) => sum + (Number(a.amount)||0), 0) / e.projects.length;
                    const totalShare = share + allowShare;

                    groupedProj[key].laborCost += totalShare;
                    if(!groupedProj[key].dayMap[r.date]) groupedProj[key].dayMap[r.date] = { laborMap: {}, matItems: [], otherItems: [] };
                    
                    const taskName = pr.taskName || '施工';
                    if(!groupedProj[key].dayMap[r.date].laborMap[taskName]) {
                        groupedProj[key].dayMap[r.date].laborMap[taskName] = { taskName, count: 0, persons: [], totalAmount: 0 };
                    }
                    groupedProj[key].dayMap[r.date].laborMap[taskName].count += 1;
                    groupedProj[key].dayMap[r.date].laborMap[taskName].persons.push(e.name);
                    groupedProj[key].dayMap[r.date].laborMap[taskName].totalAmount += totalShare;
                  }
                });
              });

              r.materials.forEach(m => {
                const p = projects.find(x => x.id === m.projId);
                if(p && groupedProj[`${p.name}_${p.client}`]) {
                    const costVal = Number(m.total)||0;
                    groupedProj[`${p.name}_${p.client}`].matCost += costVal;
                    if(!groupedProj[`${p.name}_${p.client}`].dayMap[r.date]) groupedProj[`${p.name}_${p.client}`].dayMap[r.date] = { laborMap: {}, matItems: [], otherItems: [] };
                    groupedProj[`${p.name}_${p.client}`].dayMap[r.date].matItems.push({
                       name: `${m.name} x${m.qty}`,
                       amount: costVal
                    });
                }
              });

              r.expenses.forEach(ex => {
                const p = projects.find(x => x.id === ex.projId);
                if(p && groupedProj[`${p.name}_${p.client}`]) {
                    const costVal = Number(ex.total)||0;
                    groupedProj[`${p.name}_${p.client}`].otherCost += costVal;
                    if(!groupedProj[`${p.name}_${p.client}`].dayMap[r.date]) groupedProj[`${p.name}_${p.client}`].dayMap[r.date] = { laborMap: {}, matItems: [], otherItems: [] };
                    groupedProj[`${p.name}_${p.client}`].dayMap[r.date].otherItems.push({
                       name: ex.name,
                       amount: costVal
                    });
                }
              });
            });

            let list = Object.values(groupedProj).map(p => {
               const totalCost = p.laborCost + p.matCost + p.otherCost;
               return {
                   ...p,
                   totalCost,
                   details: Object.entries(p.dayMap).map(([date, data]) => ({
                       date,
                       labors: Object.values(data.laborMap),
                       matItems: data.matItems,
                       otherItems: data.otherItems
                   })).sort((a,b)=>a.date.localeCompare(b.date))
               };
            });
            if(projFilter !== '全部') list = list.filter(p => p.mergedIds.includes(projFilter));
            return list;
          }, [projects, records, projFilter, monthFilter]);

          return (
            <div className="space-y-2">
              <Card className="flex gap-2">
                <select value={projFilter} onChange={e=>setProjFilter(e.target.value)} className="w-1/2 compact-select font-bold">
                  <option value="全部">全部工程</option>
                  {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <input type="month" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)} className="w-1/2 compact-input" placeholder="全部月份" />
                {monthFilter && <button onClick={()=>setMonthFilter('')} className="bg-slate-200 text-slate-700 px-2 rounded text-[11px] font-bold">清空</button>}
              </Card>

              <div className="space-y-2">
                {pStats.map((p, i) => (
                  <Card key={i} className="border border-slate-200 space-y-2">
                    <div className="mb-1">
                      <h3 className="font-extrabold text-[11px] text-slate-900 leading-tight truncate">{p.name}</h3>
                      <div className="text-[10px] text-slate-500 font-medium truncate">{p.client}</div>
                    </div>
                    
                    <div className="rounded-xl border border-slate-200 bg-slate-50 p-2 space-y-1.5">
                      <div className="grid grid-cols-4 gap-1 text-center">
                        {[['施工天數', `${p.details.filter(d => d.labors.length > 0).length} 天`, 'text-slate-800'], ['工錢', `$${Math.round(p.laborCost).toLocaleString()}`, 'text-blue-600'], ['材料', `$${Math.round(p.matCost).toLocaleString()}`, 'text-emerald-600'], ['其他', `$${Math.round(p.otherCost).toLocaleString()}`, 'text-amber-600']].map(([k, v, c]) => (
                          <div key={k} className="bg-white rounded-lg border border-slate-100 py-1"><div className="text-[10px] text-slate-400">{k}</div><div className={`font-extrabold text-[11px] ${c}`}>{v}</div></div>
                        ))}
                      </div>
                      <div className="flex items-center justify-between border-t border-slate-200 pt-1.5">
                        <span className="font-bold text-slate-600">總費用</span>
                        <span className="font-extrabold text-rose-600 text-[13px]">${Math.round(p.totalCost).toLocaleString()}</span>
                      </div>
                      <div className="flex items-center justify-between gap-2">
                        <span className="font-bold text-slate-600">收款金額</span>
                        <div className="flex items-center gap-1 bg-white border border-slate-300 rounded-lg px-2 h-[26px]">
                          <span className="text-slate-400">$</span>
                          <input type="number" value={p.collected || ''} placeholder="0" onChange={e => setProjects(prev => prev.map(x => x.id === p.id ? { ...x, collected: Number(e.target.value) || 0 } : x))} className="w-24 outline-none text-right font-extrabold text-emerald-600 bg-transparent" />
                        </div>
                      </div>
                      {!monthFilter && (p.collected || 0) > 0 && (
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-slate-600">結餘（收款－總費用）</span>
                          <span className={`font-extrabold ${(p.collected - p.totalCost) >= 0 ? 'text-blue-600' : 'text-rose-600'}`}>${Math.round(p.collected - p.totalCost).toLocaleString()}</span>
                        </div>
                      )}
                    </div>

                    {/* 工作紀錄 */}
                    <div className="space-y-1">
                      <div className="text-[10px] font-bold text-slate-600 uppercase tracking-wider bg-blue-50 px-2 py-0.5 rounded">工作紀錄</div>
                      <div className="bg-white border border-slate-200 rounded-lg p-1.5 space-y-1">
                        {p.details.map((d, dIdx) => {
                          if(d.labors.length === 0) return null;
                          const taskNames = Array.from(new Set(d.labors.map(l => l.taskName))).join('、');
                          const allPersonsSet = new Set(d.labors.flatMap(l => l.persons));
                          const allPersons = Array.from(allPersonsSet).join('、');
                          const totalPersonsCount = allPersonsSet.size;
                          const totalAmt = d.labors.reduce((sum, l) => sum + l.totalAmount, 0);

                          return (
                            <div key={dIdx} className="flex items-center justify-between text-slate-700 bg-slate-50 px-1.5 py-1 rounded text-[11px]">
                               <div className="flex items-center gap-1.5 truncate font-medium">
                                  <span className="font-mono text-blue-600 font-bold shrink-0">{d.date.slice(5)}</span>
                                  <span className="text-slate-300">|</span>
                                  <span className="truncate text-slate-800 font-bold">{taskNames}</span>
                                  <span className="text-slate-300">|</span>
                                  <span className="text-slate-500 shrink-0">{totalPersonsCount}人</span>
                                  <span className="text-slate-300">|</span>
                                  <span className="text-slate-600 truncate">{allPersons}</span>
                               </div>
                               <span className="font-extrabold text-slate-900 shrink-0 border-l border-slate-200 pl-1.5 ml-1">${Math.round(totalAmt).toLocaleString()}</span>
                            </div>
                          );
                        })}
                        {p.details.every(d => d.labors.length === 0) && <div className="text-center text-slate-400 py-1 text-[10px]">無施工</div>}
                      </div>
                    </div>

                    {/* 購買清單 */}
                    <div className="space-y-1">
                      <div className="text-[10px] font-bold text-slate-600 uppercase tracking-wider bg-emerald-50 px-2 py-0.5 rounded">購買清單</div>
                      <div className="bg-white border border-slate-200 rounded-lg p-1.5 space-y-1">
                        {p.details.flatMap(d => d.matItems.map((it, idx) => (
                          <div key={idx} className="flex items-center justify-between text-slate-700 bg-slate-50 px-1.5 py-0.5 rounded text-[11px]">
                             <span className="font-bold text-slate-800 truncate">{it.name}</span>
                             <span className="font-extrabold text-emerald-600 shrink-0">${Math.round(it.amount).toLocaleString()}</span>
                          </div>
                        )))}
                        {p.details.every(d => d.matItems.length === 0) && <div className="text-center text-slate-400 py-1 text-[10px]">無購買</div>}
                      </div>
                    </div>

                    {/* 其他費用 */}
                    <div className="space-y-1">
                      <div className="text-[10px] font-bold text-slate-600 uppercase tracking-wider bg-amber-50 px-2 py-0.5 rounded">其他費用</div>
                      <div className="bg-white border border-slate-200 rounded-lg p-1.5 space-y-1">
                        {p.details.flatMap(d => d.otherItems.map((it, idx) => (
                          <div key={idx} className="flex items-center justify-between text-slate-700 bg-slate-50 px-1.5 py-0.5 rounded text-[11px]">
                             <span className="font-bold text-slate-800 truncate">{it.name}</span>
                             <span className="font-extrabold text-amber-600 shrink-0">${Math.round(it.amount).toLocaleString()}</span>
                          </div>
                        )))}
                        {p.details.every(d => d.otherItems.length === 0) && <div className="text-center text-slate-400 py-1 text-[10px]">無其他費用</div>}
                      </div>
                    </div>

                  </Card>
                ))}
                {pStats.length===0 && <div className="text-center text-slate-400 py-4 font-medium bg-white rounded-lg border border-slate-200 text-[11px]">無資料</div>}
              </div>
            </div>
          );
        }

        function TabStats({ records, projects }) {
          const stats = useMemo(() => {
            let totalCost = 0; let laborCost = 0; let materialCost = 0; let otherCost = 0;
            records.forEach(r => {
              r.employees.forEach(e => {
                if(e.dayType!=='休假') { 
                    let c = Number(e.salary)||0;
                    let a = (e.allowances||[]).reduce((sum, al) => sum + (Number(al.amount)||0), 0);
                    let fullC = c + a;
                    laborCost += fullC; totalCost += fullC; 
                }
              });
              r.materials.forEach(m => { const c = Number(m.total)||0; materialCost += c; totalCost += c; });
              r.expenses.forEach(ex => { const c = Number(ex.total)||0; otherCost += c; totalCost += c; });
            });
            return { count: records.length, totalCost, laborCost, materialCost, otherCost };
          }, [records]);

          const laborPct = stats.totalCost > 0 ? ((stats.laborCost / stats.totalCost) * 100).toFixed(1) : '0.0';
          const matPct = stats.totalCost > 0 ? ((stats.materialCost / stats.totalCost) * 100).toFixed(1) : '0.0';
          const otherPct = stats.totalCost > 0 ? ((stats.otherCost / stats.totalCost) * 100).toFixed(1) : '0.0';

          return (
            <div className="space-y-2">
              <Card className="border border-slate-200 shadow-xs">
                <div className="flex justify-between items-center mb-2.5 pb-1.5 border-b border-slate-100">
                  <div className="flex items-center gap-1.5">
                    <span className="text-sm">📊</span>
                    <h3 className="font-extrabold text-[11px] text-slate-900">總體紀錄統計</h3>
                  </div>
                  <span className="text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full">
                    共 {stats.count} 筆紀錄
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-2 mb-2.5 text-center">
                  <div className="bg-rose-50/80 p-2 rounded-xl border border-rose-100">
                    <span className="text-[10px] font-bold text-rose-600 block mb-0.5">累積總成本支出</span>
                    <span className="text-[11px] font-black text-rose-700 block">${stats.totalCost.toLocaleString()}</span>
                  </div>
                  <div className="bg-blue-50/80 p-2 rounded-xl border border-blue-100">
                    <span className="text-[10px] font-bold text-blue-600 block mb-0.5">系統建立工程數</span>
                    <span className="text-[11px] font-black text-blue-700 block">{projects.length} 項</span>
                  </div>
                </div>

                <div className="bg-slate-50 p-2 rounded-xl border border-slate-200 space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-[10px] font-bold text-slate-600 uppercase tracking-wider">成本分類個別區塊</span>
                  </div>

                  <div className="space-y-2">
                    <div className="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs flex justify-between items-center">
                      <div>
                        <span className="text-slate-800 font-bold block text-[11px]">👷 人工費用總計</span>
                        <span className="text-[10px] text-slate-400">佔總成本 {laborPct}%</span>
                      </div>
                      <span className="font-black text-blue-600 text-sm">${stats.laborCost.toLocaleString()}</span>
                    </div>

                    <div className="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs flex justify-between items-center">
                      <div>
                        <span className="text-slate-800 font-bold block text-[11px]">📦 材料費用總計</span>
                        <span className="text-[10px] text-slate-400">佔總成本 {matPct}%</span>
                      </div>
                      <span className="font-black text-emerald-600 text-sm">${stats.materialCost.toLocaleString()}</span>
                    </div>

                    <div className="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs flex justify-between items-center">
                      <div>
                        <span className="text-slate-800 font-bold block text-[11px]">⛽ 其他費用總計</span>
                        <span className="text-[10px] text-slate-400">佔總成本 {otherPct}%</span>
                      </div>
                      <span className="font-black text-amber-600 text-sm">${stats.otherCost.toLocaleString()}</span>
                    </div>
                  </div>

                  {stats.totalCost > 0 && (
                    <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden flex mt-1">
                      <div style={{ width: `${laborPct}%` }} className="bg-blue-500 h-full" title={`人工 ${laborPct}%`} />
                      <div style={{ width: `${matPct}%` }} className="bg-emerald-500 h-full" title={`材料 ${matPct}%`} />
                      <div style={{ width: `${otherPct}%` }} className="bg-amber-500 h-full" title={`其他 ${otherPct}%`} />
                    </div>
                  )}
                </div>
              </Card>
            </div>
          );
        }

        function TabSettings({ settings, setSettings, records, setRecords, projects, setProjects, showToast }) {
          const [form, setForm] = useState(settings);
          const [newName, setNewName] = useState('');
          const [newFull, setNewFull] = useState(2500);
          const [newHalf, setNewHalf] = useState(1300);
          const [importData, setImportData] = useState('');

          const updateEmp = (idx, field, val) => {
            const arr = [...form.employees];
            arr[idx][field] = Number(val)||0;
            const updated = {...form, employees: arr};
            setForm(updated); setSettings(updated);
          };
          
          const addEmp = () => {
            if(!newName.trim()) return;
            const updated = {...form, employees: [...form.employees, {name: newName.trim(), fullRate: Number(newFull)||2500, halfRate: Number(newHalf)||1300}]};
            setForm(updated); setSettings(updated);
            setNewName(''); setNewFull(2500); setNewHalf(1300);
          };

          const removeEmp = (name) => {
            const updated = {...form, employees: form.employees.filter(e=>e.name!==name)};
            setForm(updated); setSettings(updated);
          };

          const exportText = async () => {
            const data = JSON.stringify({ settings, projects, records });
            const ok = await copyToClipboard(data);
            if(ok) showToast('已複製'); else showToast('複製失敗');
          };

          const doImport = () => {
            if(!importData.trim()) return showToast('請貼上代碼');
            try {
              const parsed = JSON.parse(importData);
              if(parsed.settings) setSettings(parsed.parsed ? parsed.settings : parsed.settings);
              if(parsed.projects) setProjects(parsed.projects);
              if(parsed.records) setRecords(parsed.records);
              showToast('已還原'); setImportData('');
            } catch(e) { showToast('格式錯誤'); }
          };

          return (
            <div className="space-y-2">
              <Card>
                <h2 className="text-[11px] font-bold text-slate-800 mb-1.5 border-b border-slate-100 pb-1">員工薪資</h2>
                <div className="space-y-1 mb-2">
                  {form.employees.map((emp, i) => (
                    <div key={emp.name} className="flex items-center gap-1 bg-slate-50 p-1 rounded-lg border border-slate-200">
                      <span className="font-extrabold text-slate-900 text-[11px] w-12 truncate">{emp.name}</span>
                      <div className="flex-1 relative"><span className="absolute -top-2 left-1 text-[9px] bg-slate-50 text-slate-400 px-0.5">全</span><input type="number" value={emp.fullRate} onChange={e=>updateEmp(i, 'fullRate', e.target.value)} className="w-full compact-input text-right font-bold text-blue-700 text-[11px]" /></div>
                      <div className="flex-1 relative"><span className="absolute -top-2 left-1 text-[9px] bg-slate-50 text-slate-400 px-0.5">半</span><input type="number" value={emp.halfRate} onChange={e=>updateEmp(i, 'halfRate', e.target.value)} className="w-full compact-input text-right font-bold text-blue-700 text-[11px]" /></div>
                      <button onClick={()=>removeEmp(emp.name)} className="w-5 h-5 flex items-center justify-center rounded border shrink-0 bg-white border-slate-200 text-slate-400 hover:text-rose-600"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
                    </div>
                  ))}
                </div>
                <div className="pt-1.5 border-t border-slate-200">
                  <div className="flex gap-1">
                    <input type="text" placeholder="姓名" value={newName} onChange={e=>setNewName(e.target.value)} className="flex-[1.5] compact-input text-[11px]" />
                    <input type="number" placeholder="全" value={newFull} onChange={e=>setNewFull(e.target.value)} className="flex-1 compact-input text-[11px]" />
                    <input type="number" placeholder="半" value={newHalf} onChange={e=>setNewHalf(e.target.value)} className="flex-1 compact-input text-[11px]" />
                    <button onClick={addEmp} className="bg-emerald-600 text-white px-2.5 rounded-lg font-bold text-[11px] shadow-xs">新增</button>
                  </div>
                </div>
              </Card>

              <Card>
                <h2 className="text-[11px] font-bold text-slate-800 mb-1.5 border-b border-slate-100 pb-1">備份</h2>
                <button onClick={exportText} className="w-full bg-slate-800 text-white py-1.5 rounded-xl font-bold mb-2 text-[11px] shadow-md">📋 複製備份</button>
                <div className="space-y-1.5">
                  <textarea value={importData} onChange={e=>setImportData(e.target.value)} rows="3" placeholder="貼上備份代碼" className="w-full p-1.5 border border-slate-200 rounded-lg text-[10px] font-mono outline-none bg-slate-50"></textarea>
                  <button onClick={doImport} className="w-full bg-blue-600 text-white py-1.5 rounded-xl font-bold text-[11px] shadow-md">📥 還原</button>
                </div>
              </Card>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
