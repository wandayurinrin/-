<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>探金小秘書 v9.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="date"], input[type="month"] { -webkit-appearance: none; }
        .compact-input { padding: 4px 6px; font-size: 11px; line-height: 1.3; border-radius: 4px; border: 1px solid #cbd5e1; outline: none; background: #fff; }
        .compact-select { padding: 4px 6px; font-size: 11px; line-height: 1.3; border-radius: 4px; border: 1px solid #cbd5e1; outline: none; background: #fff; }
        .mini-checkbox { width: 15px; height: 15px; accent-color: #2563eb; cursor: pointer; margin: 0; padding: 0; }
        body { font-size: 11px; line-height: 1.35; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-blue-200 pb-20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const copyToClipboard = async (text) => {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text); return true;
            }
          } catch (err) {}
          try {
            const textArea = document.createElement('textarea');
            textArea.value = text; textArea.style.position = 'fixed';
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            if (successful) return true;
          } catch (err) {}
          return false;
        };

        const INITIAL_SETTINGS = {
          employees: [
            { name: '帥志', fullRate: 2500, halfRate: 1300 },
            { name: '阿和', fullRate: 2500, halfRate: 1300 },
            { name: '阿翔', fullRate: 2500, halfRate: 1300 },
            { name: '阿孝', fullRate: 2500, halfRate: 1300 }
          ]
        };

        const Icon = ({ name, className = "w-4 h-4" }) => {
            const props = { className, fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
            switch(name) {
                case 'daily': return <svg {...props} viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
                case 'salary': return <svg {...props} viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
                case 'billing': return <svg {...props} viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
                case 'monthly': return <svg {...props} viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>;
                case 'report': return <svg {...props} viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
                case 'project': return <svg {...props} viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>;
                case 'add_proj': return <svg {...props} viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>;
                case 'stats': return <svg {...props} viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
                case 'settings': return <svg {...props} viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
                default: return null;
            }
        };

        const Card = ({ children, className = "" }) => (
          <div className={`bg-white rounded-lg shadow-sm border border-slate-200 p-2.5 sm:p-3 mb-2 ${className}`}>
            {children}
          </div>
        );

        function App() {
          const [activeTab, setActiveTab] = useState('daily');
          const [toast, setToast] = useState('');
          const [modal, setModal] = useState(null); 
          const [editingDailyRecord, setEditingDailyRecord] = useState(null);
          const [reportSelectedDate, setReportSelectedDate] = useState(null);
          
          const [projects, setProjects] = useState(() => JSON.parse(localStorage.getItem('v98_projects') || '[]'));
          const [records, setRecords] = useState(() => JSON.parse(localStorage.getItem('v98_records') || '[]'));
          const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('v98_settings') || JSON.stringify(INITIAL_SETTINGS)));

          useEffect(() => { localStorage.setItem('v98_projects', JSON.stringify(projects)); }, [projects]);
          useEffect(() => { localStorage.setItem('v98_records', JSON.stringify(records)); }, [records]);
          useEffect(() => { localStorage.setItem('v98_settings', JSON.stringify(settings)); }, [settings]);

          const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2500); };
          const confirmDelete = (title, msg, onConfirm) => setModal({ type: 'delete', title, msg, onConfirm });

          const handleEditDaily = (record) => {
            setEditingDailyRecord(record);
            setActiveTab('daily');
            window.scrollTo(0,0);
          };

          const handleGoToReport = (date) => {
            setReportSelectedDate(date);
            setActiveTab('report');
            window.scrollTo(0,0);
          };

          const navItems = [
            { id: 'daily', icon: 'daily', label: '每日' },
            { id: 'salary', icon: 'salary', label: '薪資' },
            { id: 'billing', icon: 'billing', label: '請款' },
            { id: 'monthly', icon: 'monthly', label: '月報' },
            { id: 'report', icon: 'report', label: '日報' },
            { id: 'project', icon: 'project', label: '工程' },
            { id: 'add_proj', icon: 'add_proj', label: '新增工程' },
            { id: 'stats', icon: 'stats', label: '統計' },
            { id: 'settings', icon: 'settings', label: '設定' }
          ];

          return (
            <div className="min-h-screen bg-slate-100 text-slate-800 pb-20 font-sans">
              {toast && (
                <div className="fixed top-3 right-3 bg-slate-900 text-white px-3 py-1.5 rounded-lg shadow-xl z-50 text-[11px] font-bold animate-fade">
                  {toast}
                </div>
              )}

              {modal && modal.type === 'delete' && (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                  <div className="bg-white rounded-xl shadow-2xl p-4 w-full max-w-sm border border-slate-200">
                    <h3 className="font-bold text-[11px] mb-1.5 text-slate-900">{modal.title}</h3>
                    <p className="text-slate-600 mb-4 text-[11px]">{modal.msg}</p>
                    <div className="flex gap-2 justify-end">
                      <button onClick={() => setModal(null)} className="px-3 py-1.5 bg-slate-100 rounded-lg text-slate-700 font-bold text-[11px]">取消</button>
                      <button onClick={() => { modal.onConfirm(); setModal(null); }} className="px-3 py-1.5 bg-rose-600 text-white rounded-lg font-bold text-[11px]">確定</button>
                    </div>
                  </div>
                </div>
              )}

              <header className="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
                <div className="max-w-4xl mx-auto px-3 py-2 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="bg-blue-600 p-1 rounded-md text-white">
                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h1 className="font-bold text-[11px] tracking-wide">探金小秘書 v9.8</h1>
                  </div>
                </div>
              </header>

              <main className="max-w-4xl mx-auto p-2 sm:p-3 space-y-2">
                {activeTab === 'daily' && <TabDailyRecord projects={projects} records={records} setRecords={setRecords} settings={settings} showToast={showToast} setActiveTab={setActiveTab} editingDailyRecord={editingDailyRecord} setEditingDailyRecord={setEditingDailyRecord} />}
                {activeTab === 'salary' && <TabSalary records={records} settings={settings} setRecords={setRecords} projects={projects} showToast={showToast} />}
                {activeTab === 'billing' && <TabBilling projects={projects} records={records} setRecords={setRecords} showToast={showToast} />}
                {activeTab === 'monthly' && <TabMonthly records={records} projects={projects} onGoToReport={handleGoToReport} />}
                {activeTab === 'report' && <TabReport records={records} projects={projects} onEdit={handleEditDaily} onDelete={(id) => confirmDelete('刪除紀錄', '確定要刪除這筆紀錄嗎？', () => setRecords(prev => prev.filter(r => r.id !== id)))} reportSelectedDate={reportSelectedDate} setReportSelectedDate={setReportSelectedDate} />}
                {activeTab === 'project' && <TabProjectRecord projects={projects} records={records} />}
                {activeTab === 'add_proj' && <TabAddProject projects={projects} setProjects={setProjects} showToast={showToast} confirmDelete={confirmDelete} />}
                {activeTab === 'stats' && <TabStats records={records} projects={projects} />}
                {activeTab === 'settings' && <TabSettings settings={settings} setSettings={setSettings} records={records} setRecords={setRecords} projects={projects} setProjects={setProjects} showToast={showToast} />}
              </main>

              <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-between px-1 z-40 pb-safe shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
                {navItems.map(tab => (
                  <button key={tab.id} onClick={() => { setActiveTab(tab.id); if(tab.id!=='daily') setEditingDailyRecord(null); }} className={`flex flex-col items-center justify-center py-1.5 flex-1 min-w-0 transition-colors ${activeTab === tab.id ? 'text-blue-600 bg-blue-50/60' : 'text-slate-500 hover:bg-slate-50'}`}>
                    <Icon name={tab.icon} className={`w-4 h-4 mb-0.5 ${activeTab === tab.id ? 'stroke-[2.5px]' : ''}`} />
                    <span className={`text-[10px] whitespace-nowrap tracking-tight ${activeTab === tab.id ? 'font-bold' : 'font-medium'}`}>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          );
        }

        function TabAddProject({ projects, setProjects, showToast, confirmDelete }) {
          const emptyProj = { id: '', name: '', client: '', location: '', tasks: [{id: generateId(), name: '', qty: 1, price: 0, total: 0}], estRevenue: 0 };
          const [form, setForm] = useState(emptyProj);
          const [expandedProj, setExpandedProj] = useState({});

          const updateForm = (k, v) => setForm(p => ({ ...p, [k]: v }));
          
          const updateTask = (id, k, v) => {
            setForm(p => {
              const newTasks = p.tasks.map(t => {
                if(t.id !== id) return t;
                const nt = { ...t, [k]: k==='name'?v:(Number(v)||0) };
                nt.total = (Number(nt.qty)||0) * (Number(nt.price)||0);
                return nt;
              });
              const est = newTasks.reduce((sum, t) => sum + (Number(t.total)||0), 0);
              return { ...p, tasks: newTasks, estRevenue: est };
            });
          };

          const addTask = () => setForm(p => ({ 
            ...p, 
            tasks: [...(p.tasks || []), {id: generateId(), name: '', qty: 1, price: 0, total: 0}] 
          }));

          const removeTask = (id) => setForm(p => {
             const newTasks = p.tasks.filter(t => t.id !== id);
             return { ...p, tasks: newTasks, estRevenue: newTasks.reduce((sum,t)=>sum+(Number(t.total)||0),0) };
          });

          const handleEdit = (proj) => {
            const cloned = JSON.parse(JSON.stringify(proj));
            if (!cloned.tasks || cloned.tasks.length === 0) {
              cloned.tasks = [{id: generateId(), name: '', qty: 1, price: 0, total: 0}];
            }
            const est = cloned.tasks.reduce((sum, t) => sum + ((Number(t.qty)||0) * (Number(t.price)||0)), 0);
            cloned.estRevenue = est;
            setForm(cloned);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast(`已載入工程：「${proj.name}」進行編輯`);
          };

          const handleSave = () => {
            if(!form.name.trim()) return showToast('請輸入工程名稱');
            if(!form.client.trim()) return showToast('請輸入客戶名稱');
            
            const cleanTasks = (form.tasks || [])
              .filter(t => t.name && t.name.trim())
              .map(t => ({
                ...t,
                qty: Number(t.qty) || 0,
                price: Number(t.price) || 0,
                total: (Number(t.qty) || 0) * (Number(t.price) || 0)
              }));

            const totalEst = cleanTasks.reduce((sum, t) => sum + t.total, 0);
            const projToSave = { 
              ...form, 
              name: form.name.trim(), 
              client: form.client.trim(), 
              tasks: cleanTasks,
              estRevenue: totalEst
            };
            
            if(form.id) {
              setProjects(prev => prev.map(p => p.id === form.id ? projToSave : p));
              showToast('更新成功！');
            } else {
              setProjects(prev => [{ ...projToSave, id: generateId() }, ...prev]);
              showToast('新增成功！');
            }
            setForm(emptyProj);
          };

          const moveProject = (index, dir) => {
            const newIdx = index + dir;
            if(newIdx < 0 || newIdx >= projects.length) return;
            const updated = [...projects];
            const temp = updated[index];
            updated[index] = updated[newIdx];
            updated[newIdx] = temp;
            setProjects(updated);
          };

          return (
            <div className="space-y-2.5">
              <Card>
                <div className="flex justify-between items-center mb-2 border-b border-slate-100 pb-1">
                  <h2 className="text-[11px] font-bold text-slate-800 flex items-center gap-1.5">
                    {form.id ? <span className="text-blue-600 font-extrabold bg-blue-50 px-2 py-0.5 rounded border border-blue-200">✏️ 編輯工程中：{form.name}</span> : '建立新工程'}
                  </h2>
                  {form.id && (
                    <button onClick={() => setForm(emptyProj)} className="text-[10px] text-slate-600 bg-slate-100 px-2 py-1 rounded-md font-bold hover:bg-slate-200 border border-slate-300">
                      ✕ 取消編輯
                    </button>
                  )}
                </div>
                
                <div className="flex gap-2 mb-2">
                  <input type="text" placeholder="工程名稱 *" value={form.name} onChange={e=>updateForm('name', e.target.value)} className="w-1/2 compact-input font-bold" />
                  <input type="text" placeholder="客戶名稱 *" value={form.client} onChange={e=>updateForm('client', e.target.value)} className="w-1/2 compact-input font-bold" />
                </div>

                <div className="bg-slate-50 p-2 rounded-lg border border-slate-200">
                  <div className="flex justify-between items-center mb-1.5">
                    <span className="text-[11px] font-bold text-slate-600">建立工作項目 (金額僅供預估營收用)</span>
                    <span className="text-[11px] font-bold text-blue-600">預估: ${form.estRevenue.toLocaleString()}</span>
                  </div>
                  <div className="space-y-1.5">
                    {(form.tasks || []).map((t) => (
                      <div key={t.id} className="flex gap-1 items-center bg-white p-1 rounded border border-slate-200">
                        <input type="text" placeholder="項目名稱" value={t.name} onChange={e=>updateTask(t.id, 'name', e.target.value)} className="flex-1 compact-input border-none shadow-none font-medium text-[11px]" />
                        <div className="w-12"><input type="number" placeholder="數量" value={t.qty||''} onChange={e=>updateTask(t.id, 'qty', e.target.value)} className="w-full compact-input text-center px-1 text-[11px]" /></div>
                        <div className="w-16"><input type="number" placeholder="單價" value={t.price||''} onChange={e=>updateTask(t.id, 'price', e.target.value)} className="w-full compact-input text-right px-1 text-[11px]" /></div>
                        <div className="w-14 text-right font-bold text-slate-700 text-[11px] pr-1">${t.total}</div>
                        <button onClick={()=>removeTask(t.id)} className="text-rose-500 p-1 font-bold shrink-0 text-[11px]">✕</button>
                      </div>
                    ))}
                    <button onClick={addTask} className="text-[11px] text-blue-600 font-bold bg-blue-50 px-2 py-1 rounded border border-blue-100 mt-1 w-full">+ 新增項目</button>
                  </div>
                </div>

                <div className="mt-2.5 flex gap-2">
                  {form.id && <button onClick={() => setForm(emptyProj)} className="flex-1 py-1.5 bg-slate-100 rounded-lg text-slate-700 font-bold text-[11px]">取消</button>}
                  <button onClick={handleSave} className="flex-[2] py-1.5 bg-blue-600 text-white rounded-lg font-bold text-[11px] shadow-md hover:bg-blue-700 transition-colors">
                    {form.id ? '儲存更新工程' : '建立工程'}
                  </button>
                </div>
              </Card>

              {}
              <Card>
                <h2 className="text-[11px] font-bold text-slate-800 mb-2 border-b border-slate-100 pb-1">已建立清單 (點擊卡片展開細項)</h2>
                <div className="space-y-1.5">
                  {projects.map((p, index) => {
                    const isExpanded = !!expandedProj[p.id];
                    return (
                      <div key={p.id} className="bg-white border border-slate-200 rounded-lg p-2 transition-all">
                          <div className="flex justify-between items-center gap-2 cursor-pointer" onClick={()=>setExpandedProj(prev=>({...prev, [p.id]: !prev[p.id]}))}>
                              <div className="flex flex-col gap-0.5 shrink-0" onClick={e=>e.stopPropagation()}>
                                  <button onClick={()=>moveProject(index, -1)} disabled={index === 0} className="w-5 h-3.5 bg-slate-100 rounded flex items-center justify-center text-slate-600 font-bold text-[9px] disabled:opacity-30">▲</button>
                                  <button onClick={()=>moveProject(index, 1)} disabled={index === projects.length - 1} className="w-5 h-3.5 bg-slate-100 rounded flex items-center justify-center text-slate-600 font-bold text-[9px] disabled:opacity-30">▼</button>
                              </div>
                              <div className="flex-1 min-w-0">
                                  <div className="flex items-center gap-1.5">
                                      <span className="text-[11px] font-extrabold text-slate-900 truncate">{p.name}</span>
                                      <span className="text-[9px] font-bold text-blue-600 bg-blue-50 px-1 py-0.5 rounded border border-blue-100 shrink-0">
                                        {isExpanded ? '收起 ▲' : '展開 ▼'}
                                      </span>
                                  </div>
                                  <div className="text-[10px] text-slate-500 font-medium truncate">客戶: {p.client} ｜ 預估營收: ${(p.estRevenue || 0).toLocaleString()}</div>
                              </div>
                              <div className="flex items-center gap-1.5 shrink-0" onClick={e=>e.stopPropagation()}>
                                  <button onClick={()=>handleEdit(p)} className="px-2.5 py-1 bg-blue-600 text-white rounded text-[10px] font-bold shadow-xs hover:bg-blue-700">
                                    編輯
                                  </button>
                                  <button onClick={()=>confirmDelete('刪除工程', `確定刪除「${p.name}」？`, () => setProjects(pr=>pr.filter(x=>x.id!==p.id)))} className="px-2 py-1 bg-rose-50 text-rose-600 border border-rose-200 rounded text-[10px] font-bold hover:bg-rose-100">
                                    刪除
                                  </button>
                              </div>
                          </div>
                          {isExpanded && (
                              <div className="mt-2 pt-2 border-t border-slate-100 space-y-1 bg-slate-50 p-2 rounded-md">
                                  <div className="text-[10px] font-bold text-slate-500 border-b border-slate-200 pb-0.5 mb-1">細項工作內容：</div>
                                  {p.tasks && p.tasks.length > 0 ? (
                                      p.tasks.map((t, idx)=>(
                                          <div key={t.id || idx} className="text-[11px] flex justify-between items-center text-slate-700 bg-white px-2 py-1 rounded border border-slate-200">
                                              <span className="font-semibold truncate">{t.name}</span>
                                              <span className="shrink-0 font-mono text-slate-600">{t.qty} x ${t.price} = <strong className="text-blue-600">${t.total}</strong></span>
                                          </div>
                                      ))
                                  ) : (
                                      <div className="text-[10px] text-slate-400 text-center py-1 font-medium">無指定細項 (點擊右上角「編輯」即可新增)</div>
                                  )}
                              </div>
                          )}
                      </div>
                    );
                  })}
                  {projects.length===0 && <div className="text-center text-slate-400 py-3 text-[11px] bg-slate-50 rounded-lg">尚無建立工程</div>}
                </div>
              </Card>
            </div>
          );
        }

        function TabDailyRecord({ projects, records, setRecords, settings, showToast, setActiveTab, editingDailyRecord, setEditingDailyRecord }) {
          const today = new Date().toISOString().split('T')[0];
          const emptyRec = { id: '', date: today, employees: [], materials: [], expenses: [], remarks: '' };
          const [form, setForm] = useState(emptyRec);
          
          useEffect(() => {
            if (editingDailyRecord) setForm(editingDailyRecord);
            else setForm(emptyRec);
          }, [editingDailyRecord]);

          const projOptions = projects.map(p => ({ value: p.id, label: p.name, tasks: p.tasks.map(t=>t.name) }));

          const toggleEmployee = (empName) => {
            setForm(prev => {
              const exists = prev.employees.find(e => e.name === empName);
              if (exists) return { ...prev, employees: prev.employees.filter(e => e.name !== empName) };
              const rate = settings.employees.find(e => e.name === empName)?.fullRate || 2500;
              return { 
                ...prev, 
                employees: [...prev.employees, { 
                  id: generateId(), name: empName, dayType: '全天', salary: rate, billable: true,
                  projects: [], allowances: [] 
                }] 
              };
            });
          };

          const updateEmp = (id, k, v) => {
            setForm(prev => ({
              ...prev, employees: prev.employees.map(e => {
                if(e.id !== id) return e;
                const ne = { ...e, [k]: v };
                if(k === 'dayType') {
                  const baseRate = settings.employees.find(x => x.name === e.name);
                  if(baseRate) ne.salary = v === '全天' ? baseRate.fullRate : (v === '半天' ? baseRate.halfRate : 0);
                  if(v === '休假') { ne.salary = 0; ne.projects = []; ne.allowances = []; }
                }
                return ne;
              })
            }));
          };

          const addEmpProj = (empId, defaultProjId = '') => setForm(p => ({
            ...p, employees: p.employees.map(e => e.id === empId ? { ...e, projects: [...e.projects, {id: generateId(), projId: defaultProjId, taskName: '', isCustomTask: false}] } : e)
          }));
          const updateEmpProj = (empId, pId, k, v) => setForm(p => ({
            ...p, employees: p.employees.map(e => e.id === empId ? {
              ...e, projects: e.projects.map(pr => pr.id === pId ? { ...pr, [k]: v } : pr)
            } : e)
          }));
          const updateBatchProjId = (empId, oldProjId, newProjId) => setForm(p => ({
            ...p, employees: p.employees.map(e => e.id === empId ? {
              ...e, projects: e.projects.map(pr => pr.projId === oldProjId ? { ...pr, projId: newProjId } : pr)
            } : e)
          }));
          const removeEmpProj = (empId, pId) => setForm(p => ({
            ...p, employees: p.employees.map(e => e.id === empId ? { ...e, projects: e.projects.filter(pr => pr.id !== pId) } : e)
          }));

          const addAllowance = (empId) => setForm(p => ({
            ...p, employees: p.employees.map(e => e.id === empId ? { ...e, allowances: [...(e.allowances||[]), {id: generateId(), name: '津貼', amount: 0}] } : e)
          }));
          const updateAllowance = (empId, aId, k, v) => setForm(p => ({
            ...p, employees: p.employees.map(e => e.id === empId ? {
              ...e, allowances: (e.allowances||[]).map(a => a.id === aId ? { ...a, [k]: k==='amount'?(Number(v)||0):v } : a)
            } : e)
          }));
          const removeAllowance = (empId, aId) => setForm(p => ({
            ...p, employees: p.employees.map(e => e.id === empId ? { ...e, allowances: (e.allowances||[]).filter(a => a.id !== aId) } : e)
          }));

          const addItem = (type) => setForm(p => ({ 
            ...p, [type]: [...p[type], { id: generateId(), projId: '', name: '', qty: 1, price: 0, total: 0, billable: true }] 
          }));
          const updateItem = (type, id, k, v) => setForm(p => ({
            ...p, [type]: p[type].map(item => {
              if(item.id !== id) return item;
              const nItem = { ...item, [k]: (k==='qty'||k==='price'||k==='total')?(Number(v)||0):v };
              if(k==='qty' || k==='price') nItem.total = nItem.qty * nItem.price;
              return nItem;
            })
          }));
          const removeItem = (type, id) => setForm(p => ({ ...p, [type]: p[type].filter(x => x.id !== id) }));

          const handleSave = () => {
            if(!form.date) return showToast('請選擇日期');
            const cleanForm = {
              ...form,
              employees: form.employees.map(e => ({
                ...e,
                projects: e.dayType === '休假' ? [] : e.projects.filter(pr => pr.projId),
                allowances: (e.allowances||[]).filter(a => a.name.trim() && a.amount > 0)
              })),
              materials: form.materials.filter(m => m.projId && (m.name.trim() || m.total > 0)),
              expenses: form.expenses.filter(ex => ex.projId && (ex.name.trim() || ex.total > 0))
            };

            if(editingDailyRecord) {
              setRecords(prev => prev.map(r => r.id === form.id ? cleanForm : r));
              showToast('更新成功');
            } else {
              setRecords(prev => [{ ...cleanForm, id: generateId() }, ...prev]);
              showToast('儲存成功');
            }
            setForm(emptyRec); setEditingDailyRecord(null);
            setActiveTab('report'); 
          };

          return (
            <div className="space-y-2.5">
              <Card className="flex items-center gap-2">
                <span className="font-extrabold text-slate-700 text-[11px] shrink-0">日期</span>
                <input type="date" value={form.date} onChange={e=>setForm(p=>({...p, date: e.target.value}))} className="flex-1 compact-input bg-slate-50 font-bold" />
                {editingDailyRecord && <button onClick={()=>{setForm(emptyRec); setEditingDailyRecord(null);}} className="bg-slate-200 text-slate-700 px-2 py-1 rounded-md font-bold text-[11px]">取消編輯</button>}
              </Card>

              <Card>
                <div className="font-bold text-slate-800 mb-2 border-b border-slate-100 pb-1 text-[11px] flex justify-between items-center">
                  <span>出勤員工</span>
                  <span className="text-[10px] text-slate-400 font-normal">點擊下方姓名加入</span>
                </div>
                <div className="flex flex-wrap gap-1 mb-2.5">
                  {settings.employees.map(e => {
                    const active = form.employees.some(x => x.name === e.name);
                    return (
                      <button key={e.name} onClick={() => toggleEmployee(e.name)} className={`px-2.5 py-1 rounded-lg border font-bold text-[11px] transition-colors ${active ? 'bg-blue-600 text-white border-blue-600 shadow-xs' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>
                        {e.name}
                      </button>
                    );
                  })}
                </div>

                <div className="space-y-2">
                  {form.employees.map(emp => {
                     const groupedProjects = (emp.projects || []).reduce((acc, pr) => {
                         if (!acc[pr.projId]) acc[pr.projId] = [];
                         acc[pr.projId].push(pr);
                         return acc;
                     }, {});

                     return (
                      <div key={emp.id} className="border border-blue-200/80 rounded-lg bg-blue-50/20 p-2 relative">
                        <div className="flex justify-between items-center mb-1.5">
                          <span className="font-extrabold text-blue-900 text-[11px] w-16 truncate">{emp.name}</span>
                          <div className="flex items-center gap-1 flex-1 justify-end">
                            <select value={emp.dayType} onChange={e=>updateEmp(emp.id, 'dayType', e.target.value)} className="compact-select font-bold text-[11px] h-[26px]">
                              <option>全天</option><option>半天</option><option value="休假">休假</option>
                            </select>
                            {emp.dayType !== '休假' && (
                               <div className="flex items-center gap-0.5 bg-white border border-slate-300 rounded px-1 py-0.5 h-[26px]">
                                 <span className="text-[10px] text-slate-400">$</span>
                                 <input type="number" value={emp.salary} onChange={e=>updateEmp(emp.id, 'salary', e.target.value)} className="w-12 outline-none text-right font-bold text-blue-700 text-[11px] bg-transparent" />
                               </div>
                            )}
                          </div>
                        </div>
                        
                        {emp.dayType !== '休假' && (
                          <div className="space-y-1.5 mt-1">
                            {Object.entries(groupedProjects).map(([projId, prs]) => {
                               const tasksForProj = projOptions.find(po=>po.value===projId)?.tasks || [];
                               return (
                                  <div key={projId || 'empty'} className="bg-white p-1.5 rounded-md border border-slate-200">
                                      <select value={projId} onChange={e=>updateBatchProjId(emp.id, projId, e.target.value)} className="w-full compact-select text-blue-900 font-extrabold border-none bg-blue-50/60 mb-1 h-[26px]">
                                          <option value="">+ 請選擇工程</option>
                                          {projOptions.map(po => <option key={po.value} value={po.value}>{po.label}</option>)}
                                      </select>
                                      {prs.map(pr => (
                                          <div key={pr.id} className="flex gap-1 items-center pl-0.5 mb-1">
                                              {!pr.isCustomTask ? (
                                                  <select value={pr.taskName} onChange={e => {
                                                      if(e.target.value === 'CUSTOM_INPUT') updateEmpProj(emp.id, pr.id, 'isCustomTask', true);
                                                      else updateEmpProj(emp.id, pr.id, 'taskName', e.target.value);
                                                  }} className="flex-1 compact-select border-slate-200 bg-slate-50 text-[11px] h-[26px]">
                                                      <option value="">選擇工作...</option>
                                                      {tasksForProj.map(t => <option key={t} value={t}>{t}</option>)}
                                                      <option value="CUSTOM_INPUT" className="text-blue-600 font-bold">+自行輸入</option>
                                                  </select>
                                              ) : (
                                                  <div className="flex-1 flex items-center gap-1">
                                                      <input type="text" placeholder="輸入工作內容" value={pr.taskName} onChange={e=>updateEmpProj(emp.id, pr.id, 'taskName', e.target.value)} className="flex-1 compact-input bg-amber-50 text-[11px] h-[26px]" autoFocus />
                                                      <button onClick={()=>updateEmpProj(emp.id, pr.id, 'isCustomTask', false)} className="text-[11px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-600 font-bold">返回</button>
                                                  </div>
                                              )}
                                              <button onClick={()=>removeEmpProj(emp.id, pr.id)} className="text-rose-500 px-1 font-bold text-[11px]">✕</button>
                                          </div>
                                      ))}
                                      {projId && <button onClick={()=>addEmpProj(emp.id, projId)} className="text-[11px] leading-[1.3] text-blue-600 bg-blue-50 px-2 py-0.5 rounded w-full font-bold h-[26px]">+ 新增工作項目</button>}
                                  </div>
                               )
                            })}
                            <button onClick={()=>addEmpProj(emp.id, '')} className="text-[11px] leading-[1.3] text-blue-600 font-bold px-2 bg-white rounded-md border border-blue-200 w-full h-[26px] flex items-center justify-center">+ 參與工程</button>

                            <div className="mt-1 pt-1 border-t border-blue-100 space-y-1">
                              {(emp.allowances||[]).map(a => (
                                <div key={a.id} className="flex gap-1 items-center bg-white p-1 rounded border border-slate-200">
                                  <input type="text" placeholder="津貼名稱" value={a.name} onChange={e=>updateAllowance(emp.id, a.id, 'name', e.target.value)} className="flex-1 compact-input text-[11px] h-[26px]" />
                                  <input type="number" placeholder="金額" value={a.amount||''} onChange={e=>updateAllowance(emp.id, a.id, 'amount', e.target.value)} className="w-16 compact-input text-right text-[11px] font-bold text-amber-600 h-[26px]" />
                                  <button onClick={()=>removeAllowance(emp.id, a.id)} className="text-rose-500 px-1 font-bold text-[11px]">✕</button>
                                </div>
                              ))}
                              <button onClick={()=>addAllowance(emp.id)} className="text-[11px] leading-[1.3] text-amber-600 bg-amber-50 px-2 rounded w-full font-bold border border-amber-100 h-[26px] flex items-center justify-center">+ 工作津貼</button>
                            </div>
                          </div>
                        )}
                      </div>
                  )})}
                  {form.employees.length===0 && <div className="text-center text-slate-400 py-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-[11px]">請勾選出勤員工</div>}
                </div>
              </Card>

              <div className="grid grid-cols-1 gap-2">
                  <Card>
                    <div className="font-bold text-slate-800 mb-1.5 border-b border-slate-100 pb-1 text-[11px] flex justify-between items-center">
                      <span>購買物品 (材料)</span>
                      <button onClick={()=>addItem('materials')} className="text-[11px] text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded border border-blue-100">+ 物品</button>
                    </div>
                    <div className="space-y-1">
                      {form.materials.map(m => (
                        <div key={m.id} className="flex gap-1 bg-slate-50 p-1 rounded-md border border-slate-200 items-center">
                           <select value={m.projId} onChange={e=>updateItem('materials', m.id, 'projId', e.target.value)} className="w-[32%] compact-select font-bold text-[11px] h-[26px]">
                              <option value="">歸屬工程...</option>{projOptions.map(po => <option key={po.value} value={po.value}>{po.label}</option>)}
                           </select>
                           <input type="text" placeholder="品名" value={m.name} onChange={e=>updateItem('materials', m.id, 'name', e.target.value)} className="flex-1 compact-input text-[11px] h-[26px]" />
                           <input type="number" placeholder="數量" value={m.qty||''} onChange={e=>updateItem('materials', m.id, 'qty', e.target.value)} className="w-11 compact-input text-center text-[11px] h-[26px]" />
                           <input type="number" placeholder="單價" value={m.price||''} onChange={e=>updateItem('materials', m.id, 'price', e.target.value)} className="w-14 compact-input text-right text-[11px] h-[26px]" />
                           <button onClick={()=>removeItem('materials', m.id)} className="text-rose-500 px-1 font-bold text-[11px]">✕</button>
                        </div>
                      ))}
                      {form.materials.length === 0 && <div className="text-center text-slate-400 py-1 text-[11px]">無</div>}
                    </div>
                  </Card>

                  <Card>
                    <div className="font-bold text-slate-800 mb-1.5 border-b border-slate-100 pb-1 text-[11px] flex justify-between items-center">
                      <span>雜支費用 (油錢/便當等)</span>
                      <button onClick={()=>addItem('expenses')} className="text-[11px] text-amber-600 font-bold bg-amber-50 px-2 py-0.5 rounded border border-amber-100">+ 費用</button>
                    </div>
                    <div className="space-y-1">
                      {form.expenses.map(ex => (
                        <div key={ex.id} className="flex gap-1 bg-amber-50/50 p-1 rounded-md border border-amber-200 items-center">
                           <select value={ex.projId} onChange={e=>updateItem('expenses', ex.id, 'projId', e.target.value)} className="w-[32%] compact-select font-bold text-[11px] h-[26px]">
                              <option value="">歸屬工程...</option>{projOptions.map(po => <option key={po.value} value={po.value}>{po.label}</option>)}
                           </select>
                           <input type="text" placeholder="費用說明" value={ex.name} onChange={e=>updateItem('expenses', ex.id, 'name', e.target.value)} className="flex-1 compact-input text-[11px] h-[26px]" />
                           <input type="number" placeholder="總額" value={ex.total||''} onChange={e=>updateItem('expenses', ex.id, 'total', e.target.value)} className="w-16 compact-input text-right font-bold text-[11px] h-[26px]" />
                           <button onClick={()=>removeItem('expenses', ex.id)} className="text-rose-500 px-1 font-bold text-[11px]">✕</button>
                        </div>
                      ))}
                      {form.expenses.length === 0 && <div className="text-center text-slate-400 py-1 text-[11px]">無</div>}
                    </div>
                  </Card>
              </div>

              <Card>
                 <textarea value={form.remarks} onChange={e=>setForm(p=>({...p, remarks: e.target.value}))} rows="2" placeholder="備註填寫區..." className="w-full p-2 text-[11px] border border-slate-200 rounded-lg outline-none bg-slate-50 font-medium"></textarea>
              </Card>
              
              <button onClick={handleSave} className="w-full bg-blue-600 text-white font-bold py-2 rounded-xl shadow-md text-[11px]">
                {editingDailyRecord ? '更新紀錄' : '儲存紀錄'}
              </button>
            </div>
          );
        }

        function TabSalary({ records, settings, setRecords, projects, showToast }) {
          const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
          const [empFilter, setEmpFilter] = useState('全部');
          const [expanded, setExpanded] = useState({});

          const projMap = useMemo(() => {
            const m = {}; projects.forEach(p => m[p.id] = p.name); return m;
          }, [projects]);

          const updateDailySalary = (recordId, empId, val) => {
            setRecords(prev => prev.map(r => {
              if (r.id !== recordId) return r;
              return { ...r, employees: r.employees.map(e => e.id === empId ? { ...e, salary: Number(val) || 0 } : e) };
            }));
          };

          const stats = useMemo(() => {
            const filteredRecs = records.filter(r => r.date.startsWith(month));
            const empMap = {};
            settings.employees.forEach(e => empMap[e.name] = { name: e.name, days: 0, holidayDays: 0, totalAmount: 0, details: [] });
            
            filteredRecs.forEach(r => {
              r.employees.forEach(e => {
                if(!empMap[e.name]) empMap[e.name] = { name: e.name, days: 0, holidayDays: 0, totalAmount: 0, details: [] };
                
                let allowanceSum = (e.allowances||[]).reduce((sum, a) => sum + (Number(a.amount)||0), 0);
                let recordTotalSalary = (Number(e.salary)||0) + allowanceSum;

                if(e.dayType === '休假') {
                   empMap[e.name].holidayDays += 1;
                   empMap[e.name].details.push({ recordId: r.id, empId: e.id, isHoliday: true, date: r.date, type: '休假', desc: '休假', amount: 0 });
                } else {
                   empMap[e.name].days += e.dayType === '半天' ? 0.5 : 1;
                   let dayEntry = empMap[e.name].details.find(d => d.date === r.date && !d.isHoliday);
                   
                   if (!dayEntry) {
                       dayEntry = { recordId: r.id, empId: e.id, date: r.date, type: e.dayType, projNames: new Set(), amount: 0 };
                       empMap[e.name].details.push(dayEntry);
                   }
                   
                   e.projects.forEach(pr => {
                       const pName = projMap[pr.projId] || '無工程';
                       dayEntry.projNames.add(pName);
                   });
                   dayEntry.amount = recordTotalSalary;
                }
                empMap[e.name].totalAmount += recordTotalSalary;
              });
            });

            Object.values(empMap).forEach(em => {
               em.details.forEach(d => {
                   if(d.projNames) {
                       d.desc = Array.from(d.projNames).join('、');
                   }
               });
            });

            let list = Object.values(empMap).filter(x => x.days > 0 || x.holidayDays > 0);
            if(empFilter !== '全部') list = list.filter(x => x.name === empFilter);
            return list;
          }, [records, month, empFilter, settings, projMap]);

          return (
            <div className="space-y-2">
              <Card className="flex gap-2 items-center">
                <input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="w-1/2 compact-input font-bold" />
                <select value={empFilter} onChange={e=>setEmpFilter(e.target.value)} className="w-1/2 compact-select font-bold">
                  <option>全部員工</option>
                  {settings.employees.map(e=><option key={e.name}>{e.name}</option>)}
                </select>
              </Card>

              {stats.map(s => (
                <Card key={s.name} className="p-0 overflow-hidden border-slate-200">
                  <div className="p-2 bg-white select-none cursor-pointer flex justify-between items-center" onClick={()=>setExpanded(p=>({...p, [s.name]: !p[s.name]}))}>
                    <div className="flex items-center gap-2 truncate">
                        <span className={`w-4 h-4 rounded flex items-center justify-center text-[10px] font-bold shrink-0 ${expanded[s.name] ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>{expanded[s.name]?'▲':'▼'}</span>
                        <span className="font-extrabold text-[11px] text-slate-900 truncate">{s.name}</span>
                        <span className="text-[11px] text-slate-500 font-medium shrink-0">出勤 {s.days}日 / 休假 {s.holidayDays}日</span>
                    </div>
                    <span className="font-extrabold text-blue-600 text-[11px] shrink-0">${s.totalAmount.toLocaleString()}</span>
                  </div>
                  
                  {expanded[s.name] && (
                    <div className="p-1 bg-slate-50 border-t border-slate-100 space-y-1">
                      {s.details.sort((a,b)=>a.date.localeCompare(b.date)).map((d, i) => (
                        <div key={i} className={`flex items-center text-[11px] bg-white p-1 border border-slate-200 rounded gap-2 whitespace-nowrap ${d.isHoliday?'border-l-4 border-l-amber-400':''}`}>
                          <div className="font-mono text-slate-600 font-bold shrink-0 w-10">{d.date.slice(5)}</div>
                          <div className={`shrink-0 font-bold text-center px-1.5 py-0.5 rounded text-[10px] ${d.type==='休假'?'bg-amber-100 text-amber-800':'bg-slate-100 text-slate-700'}`}>{d.type}</div>
                          <div className="flex-1 truncate font-medium text-slate-800">{d.desc}</div>
                          
                          {d.isHoliday ? (
                             <div className="font-bold text-right shrink-0 w-12 text-slate-400">-</div>
                          ) : (
                             <div className="shrink-0 w-16">
                                <input type="number" value={d.amount} onChange={e => updateDailySalary(d.recordId, d.empId, e.target.value)} className="w-full compact-input text-right font-bold text-blue-700 bg-blue-50/40 border-blue-200 text-[11px]" />
                             </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </Card>
              ))}
              {stats.length===0 && <div className="text-center text-slate-400 py-3 font-medium bg-white rounded-lg border border-slate-200 text-[11px]">無紀錄</div>}
            </div>
          );
        }

        function TabBilling({ projects, records, setRecords, showToast }) {
          const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
          const [clientFilter, setClientFilter] = useState('全部');
          const [invoiceModal, setInvoiceModal] = useState(null);
          const canvasRef = useRef(null);

          const clientGroups = useMemo(() => {
            const map = {};
            const filteredRecs = records.filter(r => r.date.startsWith(month));
            const projMap = {}; projects.forEach(p => projMap[p.id] = p);

            filteredRecs.forEach(r => {
              r.employees.forEach(e => {
                e.projects.forEach(pr => {
                  if(!pr.projId) return;
                  const proj = projMap[pr.projId];
                  if(!proj) return;
                  const cName = proj.client || '未分類';
                  if(!map[cName]) map[cName] = { client: cName, projects: {} };
                  if(!map[cName].projects[proj.id]) map[cName].projects[proj.id] = { project: proj, days: new Set(), groupedLabors: {}, items: [] };
                  
                  map[cName].projects[proj.id].days.add(r.date);
                  
                  const taskN = pr.taskName || '施工';
                  const laborKey = `${r.date}_${taskN}_${e.dayType}`;
                  const gl = map[cName].projects[proj.id].groupedLabors;
                  
                  if(!gl[laborKey]) {
                      gl[laborKey] = { date: r.date, taskName: taskN, dayType: e.dayType, count: 0, amount: 0, sourceItems: [], allBillable: true };
                  }
                  
                  const share = (Number(e.salary)||0) / e.projects.length;
                  gl[laborKey].count += 1;
                  gl[laborKey].amount += Math.round(share);
                  gl[laborKey].sourceItems.push({ recordId: r.id, empId: e.id, isBillable: e.billable !== false });
                  if(e.billable === false) gl[laborKey].allBillable = false;
                });
              });

              r.materials.forEach(m => {
                if(!m.projId) return;
                const proj = projMap[m.projId];
                if(!proj) return;
                const cName = proj.client || '未分類';
                if(!map[cName]) map[cName] = { client: cName, projects: {} };
                if(!map[cName].projects[proj.id]) map[cName].projects[proj.id] = { project: proj, days: new Set(), groupedLabors: {}, items: [] };
                map[cName].projects[proj.id].items.push({ recordId: r.id, type: 'materials', itemId: m.id, date: r.date, name: m.name, qty: m.qty, price: m.price, total: m.total, billable: m.billable !== false });
              });

              r.expenses.forEach(ex => {
                if(!ex.projId) return;
                const proj = projMap[ex.projId];
                if(!proj) return;
                const cName = proj.client || '未分類';
                if(!map[cName]) map[cName] = { client: cName, projects: {} };
                if(!map[cName].projects[proj.id]) map[cName].projects[proj.id] = { project: proj, days: new Set(), groupedLabors: {}, items: [] };
                map[cName].projects[proj.id].items.push({ recordId: r.id, type: 'expenses', itemId: ex.id, date: r.date, name: ex.name, qty: 1, price: ex.total, total: ex.total, billable: ex.billable !== false });
              });
            });

            return Object.values(map).map(g => ({
              ...g,
              projects: Object.values(g.projects).map(p => ({
                ...p, 
                daysCount: p.days.size,
                labors: Object.values(p.groupedLabors).sort((a,b)=>a.date.localeCompare(b.date)),
                items: p.items.sort((a,b)=>a.date.localeCompare(b.date))
              }))
            })).filter(g => clientFilter === '全部' || g.client === clientFilter);
          }, [projects, records, month, clientFilter]);

          const toggleGroupBillable = (sourceItems, currentVal) => {
            setRecords(prev => prev.map(r => {
                let modified = false;
                let newR = { ...r, employees: [...r.employees] };
                sourceItems.forEach(si => {
                    if (si.recordId === r.id) {
                        newR.employees = newR.employees.map(e => e.id === si.empId ? { ...e, billable: !currentVal } : e);
                        modified = true;
                    }
                });
                return modified ? newR : r;
            }));
          };

          const toggleItemBillable = (recordId, type, itemId, currentVal) => {
             setRecords(prev => prev.map(r => {
                if (r.id !== recordId) return r;
                return { ...r, [type]: r[type].map(i => i.id === itemId ? { ...i, billable: !currentVal } : i) };
             }));
          };

          const openInvoiceModal = (clientGroup) => {
            setInvoiceModal(clientGroup);
            setTimeout(() => drawInvoiceCanvas(clientGroup), 100);
          };

          const drawInvoiceCanvas = (group) => {
            const canvas = canvasRef.current;
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            
            let lineCount = 8;
            group.projects.forEach(p => {
              if (p.items.length === 0 && p.labors.length === 0) return;
              lineCount += 2 + p.labors.length + p.items.length;
            });
            
            canvas.width = 800;
            canvas.height = Math.max(600, lineCount * 30 + 150);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText('【 請款單 Invoice 】', 40, 50);

            ctx.font = '15px sans-serif';
            ctx.fillStyle = '#64748b';
            ctx.fillText(`客戶名稱：${group.client}`, 40, 85);
            ctx.fillText(`請款月份：${month}`, 400, 85);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(40, 105);
            ctx.lineTo(760, 105);
            ctx.stroke();

            let y = 145;
            let grandTotal = 0;

            group.projects.forEach(p => {
              let pTotal = 0;
              const billableLabors = p.labors.filter(l => l.allBillable);
              const billableItems = p.items.filter(i => i.billable);

              if (billableLabors.length === 0 && billableItems.length === 0) return;

              ctx.fillStyle = '#2563eb';
              ctx.font = 'bold 16px sans-serif';
              ctx.fillText(`${p.project.name} (施工 ${p.daysCount} 天)`, 40, y);
              y += 26;

              ctx.font = '14px sans-serif';
              billableLabors.forEach(l => {
                ctx.fillStyle = '#334155';
                const text = `• ${l.date}   ${l.taskName}   ${l.count}人   ${l.dayType}`;
                ctx.fillText(text, 55, y);
                ctx.fillStyle = '#0f172a';
                ctx.textAlign = 'right';
                ctx.fillText(`$${l.amount.toLocaleString()}`, 760, y);
                ctx.textAlign = 'left';
                pTotal += l.amount;
                y += 25;
              });

              billableItems.forEach(i => {
                ctx.fillStyle = '#334155';
                const text = `• ${i.date}   ${i.name} x${i.qty}`;
                ctx.fillText(text, 55, y);
                ctx.fillStyle = '#0f172a';
                ctx.textAlign = 'right';
                ctx.fillText(`$${i.total.toLocaleString()}`, 760, y);
                ctx.textAlign = 'left';
                pTotal += i.total;
                y += 25;
              });

              grandTotal += pTotal;
              y += 8;
            });

            ctx.strokeStyle = '#94a3b8';
            ctx.beginPath();
            ctx.moveTo(40, y);
            ctx.lineTo(760, y);
            ctx.stroke();
            y += 35;

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText(`總計請款金額 (Grand Total)：`, 40, y);
            ctx.fillStyle = '#dc2626';
            ctx.textAlign = 'right';
            ctx.fillText(`$${grandTotal.toLocaleString()}`, 760, y);
          };

          const downloadImage = () => {
            const canvas = canvasRef.current;
            if(!canvas) return;
            const link = document.createElement('a');
            link.download = `${invoiceModal.client}_${month}_請款單.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('已下載請款單圖片');
          };

          return (
            <div className="space-y-2">
              <Card className="flex gap-2 items-center">
                <input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="w-1/2 compact-input font-bold" />
                <select value={clientFilter} onChange={e=>setClientFilter(e.target.value)} className="w-1/2 compact-select font-bold">
                  <option value="全部">全部客戶</option>
                  {[...new Set(projects.map(p=>p.client))].map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </Card>

              {invoiceModal && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-3">
                  <div className="bg-white rounded-2xl shadow-2xl p-3 w-full max-w-2xl flex flex-col max-h-[90vh]">
                    <div className="flex justify-between items-center mb-2 border-b pb-1.5">
                      <h3 className="font-extrabold text-[11px] text-slate-900">{invoiceModal.client} - 請款單預覽</h3>
                      <button onClick={() => setInvoiceModal(null)} className="text-slate-400 hover:text-slate-700 font-bold text-base">✕</button>
                    </div>
                    <div className="flex-1 overflow-auto bg-slate-100 rounded-xl p-2 border border-slate-200 flex items-center justify-center">
                      <canvas ref={canvasRef} className="max-w-full h-auto shadow-md rounded-lg bg-white" />
                    </div>
                    <div className="flex gap-2 justify-end mt-2.5">
                      <button onClick={() => setInvoiceModal(null)} className="px-3 py-1.5 bg-slate-100 rounded-xl text-slate-700 font-bold text-[11px]">關閉</button>
                      <button onClick={downloadImage} className="px-3 py-1.5 bg-blue-600 text-white rounded-xl font-bold text-[11px] shadow-md">📥 下載請款單圖片</button>
                    </div>
                  </div>
                </div>
              )}

              {clientGroups.map(group => (
                <Card key={group.client} className="space-y-2 border-slate-200">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-1.5">
                    <h2 className="font-extrabold text-[11px] text-slate-900">{group.client}</h2>
                    <button onClick={()=>openInvoiceModal(group)} className="bg-blue-600 text-white px-2.5 py-1 rounded-md text-[11px] font-bold shadow-xs">
                      產生請款單圖片
                    </button>
                  </div>

                  {group.projects.map(proj => (
                    <div key={proj.project.id} className="space-y-2 border-b border-slate-100 last:border-0 pb-2">
                      <div className="text-[11px] font-extrabold text-blue-900 px-1 pt-1">{proj.project.name} (施工 {proj.daysCount} 天)</div>

                      {proj.labors.length > 0 && (
                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-1.5 space-y-1">
                          <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">工作紀錄</div>
                          <div className="bg-white rounded-md border border-slate-200 overflow-hidden text-[11px]">
                            {proj.labors.map((l, i) => (
                              <div key={i} className="flex items-center px-2 py-1 border-b border-slate-100 last:border-0">
                                <div className="flex items-center gap-2 flex-1 min-w-0 pr-2">
                                  <span className="font-mono text-slate-500 font-bold shrink-0">{l.date.slice(5)}</span>
                                  <span className="truncate font-semibold text-slate-800">{l.taskName}</span>
                                  <span className="text-slate-600 shrink-0">{l.count}人</span>
                                  <span className="text-slate-600 shrink-0">{l.dayType}</span>
                                </div>
                                <div className="flex items-center gap-2.5 shrink-0">
                                  <span className="font-bold text-slate-700 min-w-[50px] text-right">{l.allBillable ? `$${l.amount}` : ''}</span>
                                  <input type="checkbox" checked={l.allBillable} onChange={()=>toggleGroupBillable(l.sourceItems, l.allBillable)} className="mini-checkbox" />
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {proj.items.length > 0 && (
                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-1.5 space-y-1">
                          <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">其他費</div>
                          <div className="bg-white rounded-md border border-slate-200 overflow-hidden text-[11px]">
                            {proj.items.map((item, i) => (
                              <div key={i} className="flex items-center px-2 py-1 border-b border-slate-100 last:border-0">
                                <div className="flex items-center gap-2 flex-1 min-w-0 pr-2">
                                  <span className="font-mono text-slate-500 font-bold shrink-0">{item.date.slice(5)}</span>
                                  <span className="truncate font-semibold text-slate-800">{item.name}</span>
                                  <span className="text-slate-600 shrink-0">x{item.qty}</span>
                                </div>
                                <div className="flex items-center gap-2.5 shrink-0">
                                  <span className="font-bold text-blue-600 min-w-[50px] text-right">{item.billable ? `$${item.total}` : ''}</span>
                                  <input type="checkbox" checked={item.billable} onChange={()=>toggleItemBillable(item.recordId, item.type, item.itemId, item.billable)} className="mini-checkbox" />
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </Card>
              ))}
              {clientGroups.length === 0 && <div className="text-center text-slate-400 py-4 font-medium bg-white rounded-lg border border-slate-200 text-[11px]">無資料</div>}
            </div>
          );
        }

        function TabMonthly({ records, projects, onGoToReport }) {
          const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
          const [expandedDates, setExpandedDates] = useState({});
          
          const projMap = useMemo(() => {
            const map = {}; projects.forEach(p => map[p.id] = p.name); return map;
          }, [projects]);

          const groupedByDate = useMemo(() => {
            let list = records.filter(r => r.date.startsWith(month));
            const map = {};
            
            list.forEach(r => {
                if(r.employees.length === 0) return;
                const dateKey = r.date;
                if (!map[dateKey]) map[dateKey] = { date: dateKey, pGroup: {} };
                
                r.employees.forEach(e => {
                    if(e.dayType === '休假') return;
                    e.projects.forEach(pr => {
                        if(!pr.projId) return;
                        const key = `${pr.projId}_${e.dayType}`;
                        if(!map[dateKey].pGroup[key]) {
                            map[dateKey].pGroup[key] = { projId: pr.projId, name: projMap[pr.projId]||'未知', dayType: e.dayType, count: 0, tasks: new Set() };
                        }
                        map[dateKey].pGroup[key].count += 1;
                        map[dateKey].pGroup[key].tasks.add(pr.taskName || '施工');
                    });
                });
            });
            
            return Object.values(map).map(day => {
                const groups = Object.values(day.pGroup);
                const coverMap = {};
                groups.forEach(g => {
                    if(!coverMap[g.projId]) coverMap[g.projId] = { name: g.name, count: 0 };
                    coverMap[g.projId].count += g.count;
                });
                const coverText = Object.values(coverMap).map(c => `${c.name}(${c.count}人)`).join('、');
                
                return {
                    date: day.date,
                    coverText: coverText || '無出勤紀錄',
                    details: groups.map(g => ({ ...g, taskStr: Array.from(g.tasks).join('、') }))
                };
            }).sort((a,b)=>b.date.localeCompare(a.date));
          }, [records, month, projMap]);

          return (
            <div className="space-y-2">
              <Card className="flex items-center">
                <input type="month" value={month} onChange={e=>setMonth(e.target.value)} className="compact-input font-bold w-full" />
              </Card>

              <div className="space-y-1.5">
                {groupedByDate.map(item => (
                  <Card key={item.date} className="p-0 overflow-hidden cursor-pointer border-slate-200">
                    <div className="p-2 bg-white flex justify-between items-center" onClick={()=>setExpandedDates(p=>({...p, [item.date]: !p[item.date]}))}>
                        <div className="flex items-center gap-2 truncate">
                            <span className="font-mono text-blue-600 font-extrabold text-[11px] shrink-0">{item.date.slice(5)}</span>
                            <span className="text-[11px] text-slate-800 font-bold truncate">{item.coverText}</span>
                        </div>
                        <span className="text-[10px] text-slate-400 shrink-0 ml-1">{expandedDates[item.date]?'▲':'▼'}</span>
                    </div>
                    {expandedDates[item.date] && item.details.length > 0 && (
                        <div className="bg-slate-50 border-t border-slate-100 p-1 space-y-1">
                            {item.details.map((det, idx) => (
                                <div key={idx} onClick={(e)=>{e.stopPropagation(); onGoToReport(item.date);}} className="text-[11px] flex justify-between bg-white px-2 py-1 rounded shadow-2xs active:bg-blue-50 border border-slate-200">
                                    <div className="flex gap-1.5 truncate">
                                        <span className="font-bold text-slate-800">{det.name}</span>
                                        <span className="text-slate-300">|</span>
                                        <span className="text-slate-600">{det.count}人</span>
                                        <span className="text-slate-300">|</span>
                                        <span className="text-slate-600">{det.dayType}</span>
                                        <span className="text-slate-300">|</span>
                                        <span className="text-slate-600 truncate">{det.taskStr}</span>
                                    </div>
                                    <span className="text-[10px] text-blue-600 shrink-0 font-bold ml-2">看日報 ❯</span>
                                </div>
                            ))}
                        </div>
                    )}
                  </Card>
                ))}
                {groupedByDate.length === 0 && <div className="text-center text-slate-400 py-4 font-medium bg-white rounded-lg border border-slate-200 text-[11px]">該月無資料</div>}
              </div>
            </div>
          );
        }

        function TabReport({ records, projects, onEdit, onDelete, reportSelectedDate, setReportSelectedDate }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedDate, setSelectedDate] = useState(null);
          const [expandedCards, setExpandedCards] = useState({});
          
          useEffect(() => { 
            if (reportSelectedDate) {
              setSelectedDate(reportSelectedDate);
              setSelectedMonth(reportSelectedDate.slice(0, 7));
            } else { setSelectedDate(null); }
          }, [reportSelectedDate]);

          useEffect(() => {
              if (selectedMonth !== reportSelectedDate?.slice(0, 7)) {
                  setReportSelectedDate(null); setSelectedDate(null);
              }
          }, [selectedMonth]);

          const [yearStr, monthStr] = selectedMonth.split('-');
          const year = parseInt(yearStr); const month = parseInt(monthStr);
          const firstDayIndex = new Date(year, month - 1, 1).getDay();
          const daysInMonth = new Date(year, month, 0).getDate();

          const monthRecs = useMemo(() => records.filter(r => r.date.startsWith(selectedMonth)), [records, selectedMonth]);
          
          const summary = useMemo(() => {
              let cost = 0; let eCount = 0;
              monthRecs.forEach(r => {
                 r.employees.forEach(e => {
                     if(e.dayType!=='休假') { 
                         let s = Number(e.salary)||0;
                         let a = (e.allowances||[]).reduce((sum, al) => sum + (Number(al.amount)||0), 0);
                         cost += (s + a);
                         eCount++;
                     }
                 });
                 r.materials.forEach(m => { cost += Number(m.total)||0; });
                 r.expenses.forEach(ex => { cost += Number(ex.total)||0; });
              });
              return { cost, count: monthRecs.length, eCount };
          }, [monthRecs]);

          const workDates = new Set(); const holidayDates = new Set();
          monthRecs.forEach(r => {
             const isHoliday = r.employees.every(e => e.dayType === '休假') && r.materials.length===0 && r.expenses.length===0 && r.employees.length>0;
             if(isHoliday) holidayDates.add(r.date); else workDates.add(r.date);
          });

          const displayRecs = useMemo(() => {
             if(selectedDate) return monthRecs.filter(r => r.date === selectedDate);
             return monthRecs.sort((a,b)=>b.date.localeCompare(a.date));
          }, [monthRecs, selectedDate]);

          const projMap = useMemo(() => {
            const map = {}; projects.forEach(p => map[p.id] = p.name); return map;
          }, [projects]);

          return (
            <div className="space-y-2">
              <div className="flex gap-2">
                <div className="flex-1 bg-white rounded-xl shadow-sm p-2.5 border border-slate-200 flex flex-col justify-between">
                    <h3 className="font-bold text-slate-600 text-[11px] mb-1.5 border-b border-slate-100 pb-1">日報摘要</h3>
                    <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="text-[11px] font-bold outline-none border-b border-slate-200 pb-1 w-full bg-transparent mb-1.5 text-slate-800" />
                    <div className="space-y-1.5">
                        <div>
                            <p className="text-slate-400 text-[10px]">總成本</p>
                            <p className="font-bold text-rose-600 text-sm">${summary.cost.toLocaleString()}</p>
                        </div>
                        <div className="flex justify-between items-center gap-1 pt-1.5 border-t border-slate-100">
                            <div>
                                <p className="text-slate-400 text-[10px]">紀錄數</p>
                                <p className="font-bold text-slate-800 text-[11px]">{summary.count}</p>
                            </div>
                            <div>
                                <p className="text-slate-400 text-[10px]">施工/休</p>
                                <p className="font-bold text-slate-800 text-[11px]">{workDates.size} / {holidayDates.size}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="flex-[1.3] bg-white rounded-xl shadow-sm p-2.5 border border-slate-200 flex flex-col justify-between">
                    <div className="flex justify-between items-center mb-1.5 pb-1 border-b border-slate-100">
                        <h3 className="font-bold text-slate-600 text-[11px]">當月日曆</h3>
                        {selectedDate && <button onClick={() => {setSelectedDate(null); setReportSelectedDate(null);}} className="text-[10px] text-blue-600 font-bold bg-blue-50 px-1.5 py-0.5 rounded">顯示整月</button>}
                    </div>
                    <div>
                        <div className="grid grid-cols-7 gap-0.5 text-center text-[10px] font-bold text-slate-400 mb-0.5">
                            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                        </div>
                        <div className="grid grid-cols-7 gap-0.5 text-center text-[11px]">
                            {Array.from({ length: firstDayIndex }).map((_, i) => <div key={`empty-${i}`} />)}
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                                const day = i + 1;
                                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                const isWork = workDates.has(dateStr);
                                const isHol = holidayDates.has(dateStr);
                                const isSel = selectedDate === dateStr;
                                
                                let styleClass = "text-slate-800 font-medium"; 
                                if (isWork) {
                                    styleClass = "text-blue-600 font-bold";
                                } else if (isHol) {
                                    styleClass = "text-amber-500 font-bold";
                                }
                                
                                if (isSel) {
                                    styleClass += " bg-slate-200 ring-1 ring-slate-400 rounded";
                                }

                                return (
                                    <div key={dateStr} onClick={() => setSelectedDate(dateStr === selectedDate ? null : dateStr)}
                                          className={`aspect-square flex items-center justify-center rounded cursor-pointer transition-all ${styleClass}`}>
                                        {day}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
              </div>

              <div className="space-y-1.5">
                <div className="text-[11px] font-bold text-slate-500 tracking-wider pl-1">{selectedDate ? `📌 ${selectedDate} 紀錄明細` : '📋 所有紀錄明細'}</div>
                {displayRecs.map(r => {
                  const isHoliday = r.employees.every(e => e.dayType === '休假') && r.materials.length===0 && r.expenses.length===0 && r.employees.length>0;
                  
                  const projGrouped = {};
                  r.employees.forEach(e => {
                      if(e.dayType==='休假') return;
                      e.projects.forEach(pr => {
                          const pName = projMap[pr.projId] || '未分類工程';
                          if(!projGrouped[pName]) projGrouped[pName] = { emps: [], tasks: new Set() };
                          projGrouped[pName].tasks.add(pr.taskName || '施工');
                          projGrouped[pName].emps.push({ name: e.name, dayType: e.dayType });
                      });
                  });

                  const mats = r.materials;
                  const exps = r.expenses;
                  const isExpanded = expandedCards[r.id];

                  return (
                    <Card key={r.id} className={`p-0 overflow-hidden border-0 shadow-sm ${isHoliday ? 'ring-1 ring-amber-300' : 'ring-1 ring-slate-200'}`}>
                      <div onClick={()=>setExpandedCards(prev=>({...prev, [r.id]: !prev[r.id]}))} className={`p-2 flex justify-between items-center border-b cursor-pointer select-none ${isHoliday ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200'}`}>
                         <div className="flex items-center gap-2 truncate">
                           <span className="font-mono text-slate-900 font-black text-[11px]">{r.date}</span>
                           <span className="text-slate-300">|</span>
                           <span className="font-bold text-blue-900 truncate text-[11px]">
                             {isHoliday ? '⛱️ 休假' : Object.keys(projGrouped).join('、')}
                           </span>
                         </div>
                         <div className="flex items-center gap-2">
                           <span className="text-[10px] text-slate-400 font-bold">{isExpanded ? '收起▲' : '展開▼'}</span>
                           <div className="flex gap-1" onClick={e=>e.stopPropagation()}>
                             <button onClick={()=>onEdit(r)} className="px-2 py-0.5 bg-white text-blue-600 border border-blue-200 rounded text-[10px] font-bold shadow-2xs">編輯</button>
                             <button onClick={()=>onDelete(r.id)} className="px-2 py-0.5 bg-white text-rose-600 border border-rose-200 rounded text-[10px] font-bold shadow-2xs">刪除</button>
                           </div>
                         </div>
                      </div>

                      {isExpanded && (
                        <div className="p-2 space-y-2 text-[11px]">
                           {!isHoliday && Object.entries(projGrouped).map(([pName, data], idx) => {
                              const taskStr = Array.from(data.tasks).join('、');
                              const empTypesSet = Array.from(new Set(data.emps.map(e => e.dayType))).join('/');
                              const empNamesStr = data.emps.map(e => e.name).join('、');
